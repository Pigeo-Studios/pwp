plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.pwp'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.4.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.zaxxer:HikariCP:6.2.1'
    implementation 'com.mysql:mysql-connector-j:9.2.0'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.mindrot:jbcrypt:0.4'
}

application {
    mainClass = 'com.pwp.core.CoreApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    archiveBaseName = 'core-service'
    archiveClassifier = ''
    archiveVersion = '1.0.0'
    manifest {
        attributes 'Main-Class': 'com.pwp.core.CoreApplication'
    }
}

build.dependsOn shadowJar

task writeVersionFiles {
    doLast {
        def gitDir = rootProject.projectDir.parentFile
        def describe = "dev"
        def commit = "unknown"
        def logText = ""
        try {
            describe = "git describe --tags --always".execute(null, gitDir).text.trim()
            commit = "git rev-parse --short HEAD".execute(null, gitDir).text.trim()
            logText = "git log --oneline --no-decorate ".execute(null, gitDir).text.trim()
        } catch (Exception ignored) {}
        new File(projectDir, "version.txt").text = describe
        new File(projectDir, "commit.txt").text = commit
        new File(projectDir, "changelog.txt").text = logText
    }
}

processResources.dependsOn writeVersionFiles
run.dependsOn writeVersionFiles
