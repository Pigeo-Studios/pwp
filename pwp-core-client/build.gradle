buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}
apply plugin: 'org.spongepowered.mixin'

group = 'com.pwp'
version = '1.0.1'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.export', 'true'
            args '-mixin.config=pwp_core_client.mixins.json'
            mods { pwpcoreclient { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "pwp_core_client.refmap.json"
    config "pwp_core_client.mixins.json"
    debug.export = true
}

// The Mixin AP fails to emit an obfuscation mapping for the generic
// Screen.addRenderableWidget @Invoker (duplicate tsrg entries). Inject the
// refmap entry manually so the invoker resolves in production (SRG) runs.
tasks.named('compileJava') {
    doLast {
        def injectEntry = {
            File refmap ->
            if (!refmap.exists()) return
            def json = new groovy.json.JsonSlurper().parse(refmap)
            def entry = [
                    addRenderableWidget: "Lnet/minecraft/client/gui/screens/Screen;m_142416_(Lnet/minecraft/client/gui/components/events/GuiEventListener;)Lnet/minecraft/client/gui/components/events/GuiEventListener;"
            ]
            json.mappings["com/pwp/coreclient/mixin/ScreenInvoker"] = entry
            json.data.searge["com/pwp/coreclient/mixin/ScreenInvoker"] = entry
            refmap.setText(new groovy.json.JsonBuilder(json).toPrettyString(), 'UTF-8')
        }
        injectEntry(file("${buildDir}/tmp/compileJava/compileJava-refmap.json"))
        injectEntry(file("${buildDir}/tmp/compileJava/pwp_core_client.refmap.json"))
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation project(':pwp-core-server')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
