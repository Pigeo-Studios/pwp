buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}
apply plugin: 'org.spongepowered.mixin'

group = 'com.pwp'
version = '1.0.1'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.debug.export', 'true'
            args '-mixin.config=pwp_core_client.mixins.json'
            mods { pwpcoreclient { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "pwp_core_client.refmap.json"
    config "pwp_core_client.mixins.json"
    debug.export = true
}

// Mixin AP нестабильно эмитит маппинг генерик-метода Screen.addRenderableWidget
// для @Invoker (в tsrg метод дублируется — наследуется всеми подклассами
// Screen). Без записи кнопка отмены в ConnectScreen не зарегистрируется
// в проде (SRG). Вписываем запись принудительно после компиляции; если
// рефмап не сгенерирован — падаем.
tasks.named('compileJava') {
    // Рефмап — побочный выход Mixin AP. Инкрементальные и прерванные
    // пересборки теряют его (классы остаются, рефмап исчезает), из-за чего
    // в релизный jar рефмап не попадал (краш клиента в проде). Принудительно
    // перекомпилируем модуль на каждой сборке — AP перегенерирует рефмап.
    outputs.upToDateWhen { false }
    doLast {
        def entry = [
                addRenderableWidget: "Lnet/minecraft/client/gui/screens/Screen;m_142416_(Lnet/minecraft/client/gui/components/events/GuiEventListener;)Lnet/minecraft/client/gui/components/events/GuiEventListener;"
        ]
        def refmaps = [
                file("${buildDir}/tmp/compileJava/compileJava-refmap.json"),
                file("${buildDir}/tmp/compileJava/pwp_core_client.refmap.json")
        ]
        // Именованный рефмап MixinGradle создаёт после compileJava (из
        // compileJava-refmap.json), поэтому его инжектим только если он уже
        // появился. Отсутствие главного рефмапа — фатально.
        def primary = refmaps[0]
        if (!primary.exists()) {
            throw new GradleException("FAIL: рефмап не сгенерирован Mixin AP: $primary")
        }
        refmaps.each { refmap ->
            if (!refmap.exists()) return
            def json = new groovy.json.JsonSlurper().parse(refmap)
            json.mappings["com/pwp/coreclient/mixin/ScreenInvoker"] = entry
            json.data.searge["com/pwp/coreclient/mixin/ScreenInvoker"] = entry
            refmap.setText(new groovy.json.JsonBuilder(json).toPrettyString(), 'UTF-8')
        }
        println "OK: запись ScreenInvoker вписана в рефмап"
    }
}

// Guard: в релизный jar обязан попадать рефмап с записью для ScreenInvoker,
// иначе миксины не найдут таргеты в проде (SRG) и клиент упадёт при
// загрузке или при открытии ConnectScreen. Если чего-то нет — сборка падает.
tasks.named('jar') {
    doLast {
        def refmapName = "pwp_core_client.refmap.json"
        def jarFile = archiveFile.get().asFile
        def refmapText = null
        def fs = java.nio.file.FileSystems.newFileSystem(jarFile.toPath(), [:] as Map)
        try {
            def p = fs.getPath(refmapName)
            if (p != null && java.nio.file.Files.exists(p)) {
                refmapText = new String(java.nio.file.Files.readAllBytes(p), 'UTF-8')
            }
        } finally {
            fs.close()
        }
        if (refmapText == null) {
            throw new GradleException("FAIL: $jarFile.name не содержит $refmapName — релизный jar сломает миксины в проде")
        }
        if (!refmapText.contains('"com/pwp/coreclient/mixin/ScreenInvoker"') || !refmapText.contains('m_142416_')) {
            throw new GradleException("FAIL: $jarFile.name — в $refmapName нет записи ScreenInvoker (addRenderableWidget)")
        }
        println "OK: $jarFile.name — рефмап + запись ScreenInvoker присутствуют"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation project(':pwp-core-server')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
