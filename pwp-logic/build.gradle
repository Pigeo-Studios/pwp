// Чистая логика PWP без Minecraft/Forge: обычный java-library + JUnit 5.
// Тесты идут за секунды: gradlew :pwp-logic:test (без ForgeGradle-задач).
//
// Исходники НЕ публикуются отдельным jar: каждая папка src/<модуль>/java подключена
// как srcDir в свой Forge-модуль (api, coreclient -> pwp-core; warfare -> pwp-game)
// и компилируется ВНУТРЬ его jar. Пакеты прежние,
// split-package между модами нет, runClient/обфускация/упаковка не меняются.
// Правило: здесь не должно быть импортов net.minecraft / net.minecraftforge / io.netty.
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/api/java', 'src/warfare/java', 'src/coreclient/java']
        }
    }
}

dependencies {
    // Gson — для кодека map_config (warfare/layout/MapLayoutCodec). В рантайме его даёт Minecraft
    // (1.20.1 = Gson 2.10.1), поэтому только compileOnly: в jar Forge-модулей отдельно не пакуется.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Тесты читают боевые файлы (карты, lang, белый список клавиш) — они входы теста, иначе Gradle
    // считает тест «up-to-date» и не замечает сломанный путь (после слияния модулей так и было)
    inputs.dir('../maps').withPropertyName('maps')
    inputs.dir('../pwp-game/src/main/resources/assets/pwpwarfare/lang').withPropertyName('warfareLang')
    inputs.dir('../pwp-core/src/main/resources/assets/pwp_core_client/controls').withPropertyName('controls')
}
