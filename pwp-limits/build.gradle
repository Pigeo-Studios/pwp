plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'com.pigeostudios.pwp'
version = '1.0.3'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                pwplimit {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Прод-жарник ParCool для компиляции клиентского HUD стамины
// (compileOnly — в jar не кладётся, в рантайме мод обязателен на клиенте и сервере)
def pwpfiles = System.getenv('PWPFILES_DIR') ?: 'C:/Users/maska/OneDrive/Desktop/Pwpfiles'
def parcoolJar = file("${pwpfiles}/mods/ParCool-1.20.1-3.4.3.3.jar")

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    compileOnly files(parcoolJar)
}

jar {
    manifest {
        attributes([
                "Specification-Title": "pwplimit",
                "Specification-Vendor": "pigeostudios",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "pigeostudios",
        ])
    }
    // Гигиена build/libs: gradle НЕ удаляет старые jar при смене version, а
    // build.bat копирует ВСЕ pwp-limits-*.jar на сервер -> Forge грузит
    // случайную версию (инцидент 12.08.2026: 1.0.2 вернулся на серверы и в
    // Pwpfiles/mods после пересборки). Оставляем только свежий jar.
    doLast {
        def built = archiveFile.get().asFile
        fileTree('build/libs') { include 'pwp-limits-*.jar' }.each { f ->
            if (!f.canonicalPath.equalsIgnoreCase(built.canonicalPath)) {
                f.delete()
                println "Removed stale jar: ${f.name}"
            }
        }
    }
}
