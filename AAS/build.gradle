plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.8.0'
group = 'com.example.aas'
archivesBaseName = 'aas'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mixin.config', 'aas.mixins.json'
            mods {
                aas {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mixin.config', 'aas.mixins.json'
            mods {
                aas {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        url 'https://cursemaven.com'
    }
    maven {
        url 'https://maven.theillusivec4.top/'
    }
    maven {
        url 'https://maven.maxhenkel.de/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.20'
    implementation 'software.bernie.geckolib:geckolib-forge-1.20.1:4.4.2'
    compileOnly 'top.theillusivec4.curios:curios-forge:5.3.1+1.20.1:api'
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'aas.refmap.json'
    config 'aas.mixins.json'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "Advance And Secure",
            "Specification-Vendor": "danilfb123",
            "Specification-Version": "1",
            "Implementation-Title": "AAS",
            "Implementation-Version": "1.0.0",
            "Implementation-Vendor": "danilfb123",
            "MixinConfigs": "aas.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
